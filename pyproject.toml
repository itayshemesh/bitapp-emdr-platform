[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bitapp-emdr-platform"
version = "1.0.0"
description = "Generic Bilateral Stimulation Protocol Engine and Specific Bi-Tapp EMDR Companion"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Itay Shemesh"}
]

[tool.setuptools.packages.find]
where = ["."]
include = ["framework*", "apps*"]
